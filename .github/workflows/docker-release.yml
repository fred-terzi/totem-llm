name: Docker Release

description: >
  Build and push the Totem LLM Docker image to Docker Hub
  when a version tag is pushed. Requires the npm package
  to be published first (see RELEASE.md).

on:
  push:
    tags:
      - 'v*'
  # Manual trigger from GitHub UI for re-publishing
  workflow_dispatch:
    inputs:
      version:
        description: 'NPM package version to install (e.g. 0.16.1). Leave empty for latest.'
        required: false
        default: ''

env:
  REGISTRY: docker.io
  IMAGE_NAME: fred-terzi/totem-llm

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      # ── Determine version ──────────────────────────────────────
      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            # Manual dispatch with explicit version
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            # Tag push: strip leading 'v'
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            # Manual dispatch without version → use latest
            echo "version=latest" >> $GITHUB_OUTPUT
          fi
          echo "Using version: ${{ steps.version.outputs.version }}"

      # ── Checkout (for Dockerfile) ──────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Verify npm package exists ──────────────────────────────
      - name: Verify npm package is published
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$VERSION" = "latest" ]; then
            echo "Using @latest — skipping version check"
          else
            echo "Checking if totem-llm@$VERSION exists on npm..."
            npm view totem-llm@$VERSION version || {
              echo "::error::Package totem-llm@$VERSION not found on npm. Publish it first (npm publish)."
              exit 1
            }
            echo "✓ totem-llm@$VERSION found on npm"
          fi

      # ── Set up Docker Buildx ───────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Login to Docker Hub ────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Build & Push ───────────────────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          build-args: |
            TOTEM_LLM_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      # ── Smoke test (optional but recommended) ──────────────────
      - name: Smoke test
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Pulling and testing ${{ env.IMAGE_NAME }}:$VERSION..."

          # Run container in background
          docker run -d --name totem-smoke-test \
            -p 18686:8686 \
            "$IMAGE_NAME:$VERSION"

          # Wait for health
          echo "Waiting for Totem LLM to start..."
          for i in $(seq 1 60); do
            if curl -s --max-time 2 http://localhost:18686/api/ping > /dev/null 2>&1; then
              echo "✓ Totem LLM is responding"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Totem LLM did not start within 60s"
              docker logs totem-smoke-test
              docker stop totem-smoke-test
              exit 1
            fi
            sleep 2
          done

          # Verify API
          PING=$(curl -s http://localhost:18686/api/ping)
          echo "Health check: $PING"

          # Cleanup
          docker stop totem-smoke-test
          docker rm totem-smoke-test

          echo "✓ Smoke test passed"
