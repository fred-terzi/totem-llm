name: Release

on:
  push:
    branches: [main-totem]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for conventional-commits parsing

      - uses: actions/setup-node@v4
        with:
          # Node 22 required: this step installs the root devDependencies (the
          # toolchain), several of which now demand a newer Node — and yarn 1
          # enforces `engines`, hard-failing the install on the first mismatch:
          #   @babel/core@8 / @babel/preset-env@8        → ^22.18.0 || >=24.11.0
          #   @commitlint/cli@21 / config-conventional@21 → >=22.12.0
          #   @langchain/textsplitters / fix-path        → >=20
          # Node 22 (22.23.x) satisfies all of them. These are dev-only toolchain
          # deps (never shipped in the Docker/npm runtime image — the app itself
          # still targets Node 18), so only this CI install needs Node 22.
          node-version: 22

      - name: Install dependencies
        run: yarn install --ignore-scripts

      - name: Create release
        id: release
        run: |
          # standard-version auto-detects bump level from conventional commits since last tag:
          #   feat! / BREAKING CHANGE  → major
          #   feat                     → minor
          #   fix / perf / revert      → patch
          #   no applicable commits    → no-op (exits 0, no commit or tag created)
          BEFORE=$(git rev-parse HEAD)

          yarn standard-version 2>&1

          AFTER=$(git rev-parse HEAD)

          if [ "$BEFORE" != "$AFTER" ]; then
            TAG=$(git describe --tags --abbrev=0)
            echo "created=true"  >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}"   >> "$GITHUB_OUTPUT"
            echo "::notice::Released: ${TAG}"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "No release-worthy commits since last tag — skipping."
          fi

      - name: Push release commit + tags
        if: steps.release.outputs.created == 'true'
        run: |
          git push
          git push --tags
          echo "Released ${steps.release.outputs.tag} — commit + tag pushed."
