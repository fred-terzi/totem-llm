# ──────────────────────────────────────────────────────────────────────────────
# Totem LLM — Beta Docker Compose
#
# Purpose:
#   Build and serve the latest `dev-totem` branch from source (not the
#   published npm package) for beta testing before publish.
#
# PERMANENT URL:
#   The container runs a Cloudflare NAMED tunnel (token in docker/beta/.env)
#   and serves:
#
#       https://beta.totemai.xyz        ← permanent URL
#
#   Tunnel:  "totem-beta" (f2d1f1e1-4be1-4248-9865-730d6c3da049)
#   Ingress: beta.totemai.xyz → http://localhost:13000 (managed remotely on
#            Cloudflare — change routing in the Zero Trust dashboard or via
#            the API, no container rebuild needed)
#   DNS:     beta.totemai.xyz CNAME f2d1f1e1-….cfargotunnel.com (proxied)
#
#   NOTE: The zone totemai.xyz is ACTIVE on Cloudflare only after the
#   nameservers are switched at Namecheap to:
#       dolly.ns.cloudflare.com
#       malcolm.ns.cloudflare.com
#   Until then the URL will not resolve publicly.
#
# FALLBACK (temporary URL):
#   If TUNNEL_TOKEN is unset in docker/beta/.env, run.sh launches an
#   account-less "quick tunnel" and the URL is a random
#   https://<words>.trycloudflare.com printed to the container logs.
#
# Usage:
#   docker compose -f docker/beta/docker-compose.yml up --build -d
#
# Then watch the logs for the highlighted URL banner:
#   docker compose -f docker/beta/docker-compose.yml logs -f totem-beta
#
# The three local host ports (default 31300, 32686, 32888) are for direct
# debugging if needed:
#   http://localhost:31300   →  Vite dev server (UI + /api proxy)  ← tunnel target
#   http://localhost:32686   →  Express API
#   http://localhost:32888   →  Collector
#
# To use a different branch or fork, override the env vars:
#   REPO_BRANCH=feature-xyz docker compose -f docker/beta/docker-compose.yml up
#   REPO_URL=https://github.com/someone/totem-llm.git docker compose ... up
#
# Rotate the tunnel token (docker/beta/.env), e.g. via the Cloudflare API:
#   GET /accounts/<account_id>/cfd_tunnel/f2d1f1e1-4be1-4248-9865-730d6c3da049/token
#   → paste into docker/beta/.env as TUNNEL_TOKEN=… → docker compose up -d
#
# Tear down (keeps the volume so the clone + node_modules persist):
#   docker compose -f docker/beta/docker-compose.yml down
#
# Full reset (wipes the clone, node_modules, DB, and storage):
#   docker compose -f docker/beta/docker-compose.yml down --volumes
# ──────────────────────────────────────────────────────────────────────────────

name: totem-beta

services:
  totem-beta:
    build:
      context: ../..   # repo root — needed because the Dockerfile COPYs docker/beta/run.sh
      dockerfile: docker/beta/Dockerfile
    container_name: totem-beta
    restart: unless-stopped
    ports:
      # Host ports are configurable so you can run alongside a local dev
      # instance (which occupies 13000, 28686, 28888).
      # Defaults use the 30k range to avoid conflicts:
      #   31300:13000  — Vite dev (user-facing; proxies /api)
      #   32686:28686  — Express API (direct debugging)
      #   32888:28888  — Collector (internal; debugging)
      # Override with: HOST_FRONTEND_PORT=... docker compose up
      - "${HOST_FRONTEND_PORT:-31300}:13000"
      - "${HOST_SERVER_PORT:-32686}:28686"
      - "${HOST_COLLECTOR_PORT:-32888}:28888"
    volumes:
      # /app holds the git clone + node_modules. Persisting it means
      # `docker compose up` on a subsequent run only does a `git pull`
      # (fast) instead of a full re-clone + reinstall.
      - totem-beta-work:/app
      # /app/totem-storage is where lib/setup.js writes the SQLite DB,
      # secrets (.env), comkey PEM, vector cache, etc.
      - totem-beta-data:/app/totem-storage
    environment:
      # ── Repo ────────────────────────────────────────────────────────────
      # REPO_URL defaults to https://github.com/fred-terzi/totem-llm.git
      # REPO_BRANCH defaults to dev-totem
      # Uncomment / override as needed:
      # REPO_URL: https://github.com/fred-terzi/totem-llm.git
      # REPO_BRANCH: dev-totem

      # ── LLM / Embedding / Vector DB ────────────────────────────────────
      # The beta image does NOT bundle Ollama. Configure whatever provider
      # you want to test against. The .env generated by `yarn setup`
      # (from server/.env.example) is the starting point; these env vars
      # take precedence at runtime because server/index.js reads process.env
      # after dotenv (dotenv does not overwrite existing process.env keys).
      #
      # Example — Ollama on the host (Docker Desktop / Linux with the
      # Ollama server reachable at host.docker.internal):
      #   LLM_PROVIDER: ollama
      #   OLLAMA_BASE_PATH: http://host.docker.internal:11434
      #   EMBEDDING_ENGINE: ollama
      #   EMBEDDING_BASE_PATH: http://host.docker.internal:11434
      #   EMBEDDING_MODEL_PREF: nomic-embed-text:latest
      #   VECTOR_DB: lancedb
      #
      # Example — OpenAI:
      #   LLM_PROVIDER: openai
      #   OPENAI_API_KEY: sk-...
      #   OPENAI_MODEL_PREF: gpt-4o
      #   EMBEDDING_ENGINE: openai
      #   EMBEDDING_MODEL_PREF: text-embedding-3-small
      #   VECTOR_DB: lancedb
      #
      # Example — Anthropic:
      #   LLM_PROVIDER: anthropic
      #   ANTHROPIC_API_KEY: sk-ant-...
      #   ANTHROPIC_MODEL_PREF: claude-sonnet-4-20250514
      #   EMBEDDING_ENGINE: native
      #   VECTOR_DB: lancedb
      #
      # ── Feature flags (baked into the Vite bundle at dev-server start) ──
      # "beta" profile = hosted + filesystem tool + text splitter
      # (no terminal access, no community hub, no model router)
      TOTEM_BUILD_PROFILE: beta

      # ── WalletConnect (mobile wallet login) ────────────────────────────
      # Required for the "Start pairing" + "Open in MetaMask" flow.
      # Without this the component shows a fallback text instead of a button.
      # Value read from docker/beta/.env (same dir, gitignored) so the ID
      # never lives in this file. Create at https://dashboard.reown.com.
      VITE_WC_PROJECT_ID: "${VITE_WC_PROJECT_ID:-}"

      # ── OpenRouter ("Totem Free" inference option) ─────────────────────
      # server/utils/inferenceOptions.js gates the Totem Free option on
      # this env var — without it the picker hides the option entirely.
      # The key lives in docker/beta/.env (gitignored) alongside the
      # tunnel token. Takes precedence over the auto-generated
      # server/.env.development (dotenv does not overwrite process.env).
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL_PREF: "${OPENROUTER_MODEL_PREF:-nvidia/nemotron-3.5-lightning:free}"

      # ── $TOTEM on-chain token (Base) ───────────────────────────────────
      # Enables GET /wallet/balance — reads the user's TOTEM ERC-20 balance.
      # When unset the endpoint returns 204 and the UI hides the badge.
      TOTEM_ADDRESS: "0x0F8ac22B85076F9BfE0b93Cc49FB6426CB150F88"

      # ── Telemetry ───────────────────────────────────────────────────────
      DISABLE_TELEMETRY: "true"

      # ── Permanent URL ───────────────────────────────────────────────────
      # Passed through to run.sh. Read from docker/beta/.env (same dir) so
      # the secret never lives in this file. Rotate via the Cloudflare API:
      #   GET /accounts/<account>/cfd_tunnel/<tunnel_id>/token
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}"

    # Give the container extra time to: clone → yarn install → prisma →
    # start dev:all → serve the first request. 240 s covers a cold start
    # with a fresh clone; warm starts (volume persists) are much faster.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:13000/" ]
      interval: 30s
      timeout: 10s
      start_period: 240s
      retries: 5

volumes:
  totem-beta-work:
  totem-beta-data:
