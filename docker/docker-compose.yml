# ──────────────────────────────────────────────────────────────────────────────
# Totem LLM — Local Docker Compose (for testing outside Runpod)
#
# This is a convenience for local development/testing. The primary deployment
# target is the Runpod Pod Template (see HOW_TO_USE_DOCKER.md).
#
# Usage:
#   docker compose -f docker/docker-compose.yml up --build
#
# For GPU access, add --gpus all:
#   docker compose -f docker/docker-compose.yml --gpus all up
# ──────────────────────────────────────────────────────────────────────────────

name: totem-llm

services:
  totem:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Pin a specific version for reproducible builds:
        # TOTEM_LLM_VERSION: 0.16.1
        TOTEM_LLM_VERSION: latest
    container_name: totem-llm
    restart: unless-stopped
    ports:
      - "8686:8686"   # Totem LLM UI + API
      - "11434:11434" # Ollama API (optional)
    volumes:
      - totem-data:/app/totem-storage      # App data (DB, docs, vector cache)
      - ollama-models:/root/.ollama        # Ollama model weights
    environment:
      # GPU detection is automatic — no config needed.
      # Override model selection if desired:
      # TOTEM_MODEL_OVERRIDE: qwen3.8:27b-mtp-q8_0
      # TOTEM_CONTEXT_OVERRIDE: "32768"
      #
      # Or force specific provider settings:
      # OLLAMA_MODEL_PREF: qwen3.5:9b
      # OLLAMA_MODEL_TOKEN_LIMIT: "8192"
    # GPU passthrough (uncomment for local GPU testing):
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "/usr/local/bin/docker-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

volumes:
  totem-data:
  ollama-models:
